{% if form.non_field_errors %}
    <div class="alert alert-danger mb-4">
        {% for error in form.non_field_errors %}
            <div>{{ error }}</div>
        {% endfor %}
    </div>
{% endif %}

<div class="form-grid">
    {% for field in form %}
        <div class="form-field {% if field.name == 'notes' %}form-field--wide{% endif %}">
            <label class="form-label" for="{{ field.id_for_label }}">
                {{ field.label }}
            </label>

            {{ field }}

            {% if field.help_text %}
                <div class="form-text">
                    {{ field.help_text }}
                </div>
            {% endif %}

            {% for error in field.errors %}
                <div class="invalid-feedback d-block">
                    {{ error }}
                </div>
            {% endfor %}
        </div>
    {% endfor %}
</div>
