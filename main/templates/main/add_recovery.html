{% extends 'base.html' %}

{% block title %}Добавить recovery · RecoveryLab{% endblock %}

{% block content %}

<section class="form-card">
    <div class="form-card__header">
        <div>
            <span class="page-kicker">
                <i class="bi bi-heart-pulse"></i>
                Recovery
            </span>
            <h1>Добавить recovery</h1>
            <p>Сон, стресс, энергия и самочувствие помогут точнее оценить готовность.</p>
        </div>

        <a class="btn btn-soft btn-icon" href="{% url 'dashboard' %}" aria-label="Вернуться">
            <i class="bi bi-arrow-left"></i>
        </a>
    </div>

    <div class="form-card__body">
        <form method="post">
            {% csrf_token %}

            {% include 'main/includes/form_fields.html' %}

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check2-circle me-2"></i>
                    Сохранить recovery
                </button>

                <a class="btn btn-soft" href="{% url 'dashboard' %}">
                    Dashboard
                </a>
            </div>
        </form>
    </div>
</section>

{% endblock %}
