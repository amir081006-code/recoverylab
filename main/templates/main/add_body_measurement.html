{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="card p-4 shadow-sm">

        <h2 class="mb-4">
            Добавить измерение тела
        </h2>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                class="btn btn-primary"
            >
                Сохранить
            </button>

        </form>

    </div>

</div>

{% endblock %}
