{% extends 'base.html' %}

{% block title %}Новая тренировка · RecoveryLab{% endblock %}

{% block content %}

<section class="form-card">
    <div class="form-card__header">
        <div>
            <span class="page-kicker">
                <i class="bi bi-plus-circle"></i>
                Workout
            </span>
            <h1>Новая тренировка</h1>
            <p>Зафиксируйте нагрузку, длительность и уровень усталости после сессии.</p>
        </div>

        <a class="btn btn-soft btn-icon" href="{% url 'workout_list' %}" aria-label="Все тренировки">
            <i class="bi bi-arrow-left"></i>
        </a>
    </div>

    <div class="form-card__body">
        <form method="post">
            {% csrf_token %}

            {% include 'main/includes/form_fields.html' %}

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check2-circle me-2"></i>
                    Сохранить тренировку
                </button>

                <a class="btn btn-soft" href="{% url 'dashboard' %}">
                    Dashboard
                </a>
            </div>
        </form>
    </div>
</section>

{% endblock %}
